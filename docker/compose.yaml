# ITE4120 course template — local infrastructure.
#
#   docker compose -f docker/compose.yaml up -d      # start
#   docker compose -f docker/compose.yaml down -v    # destroy INCLUDING data
#
# One container: PostgreSQL. The schema is created entirely by Liquibase when the
# backend starts — there are deliberately no init scripts here. The database is
# disposable by design: if it is ever in a strange state, destroy and recreate
# (scripts/reset-db). Port 18520 keeps clear of anything else on your machine.
name: ite4120

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: tea
      POSTGRES_USER: ${TEA_DB_USER:-tea}
      POSTGRES_PASSWORD: ${TEA_DB_PASSWORD:-tea}
    ports:
      - "${TEA_PG_PORT:-18520}:5432"
    volumes:
      # postgres:18+ images keep PGDATA under /var/lib/postgresql/<major>/docker,
      # so the volume mounts the parent dir (mounting the old .../data path would
      # silently persist nothing).
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TEA_DB_USER:-tea} -d tea"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pgdata:
