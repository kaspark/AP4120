server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Relative redirects keep the published port (18640). An absolute
    # redirect would drop it, because nginx itself listens on port 80.
    absolute_redirect off;

    # Docker's embedded DNS. A variable in proxy_pass makes nginx resolve
    # `backend` per request, so a recreated API container is picked up.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # The register used to live at /teas. Keep that address working.
    location = /teas {
        return 302 /permits;
    }
    location = /teas/ {
        return 302 /permits;
    }
    location /teas/ {
        rewrite ^/teas/(.*)$ /permits/$1 redirect;
    }

    location /api/ {
        set $backend_host backend;
        proxy_pass http://$backend_host:18440$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
    }

    location /mock-registry/ {
        set $backend_host backend;
        proxy_pass http://$backend_host:18440$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
