server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. A variable in proxy_pass makes nginx resolve
    # `backend` per request, so a recreated API container is picked up.
    resolver 127.0.0.11 valid=30s ipv6=off;

    location /api/ {
        set $backend_host backend;
        proxy_pass http://$backend_host:18440$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
    }

    location /mock-registry/ {
        set $backend_host backend;
        proxy_pass http://$backend_host:18440$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
